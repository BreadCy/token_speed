[package]
name = "tokenspeed"
version = "0.5.10"
edition = "2021"
description = "AI coding speed monitor (tokens/s) — ZCode / Codex / OpenCode / Claude Code"
build = "build.rs"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
chrono = "0.4"
notify = "8"
eframe = { version = "0.32", default-features = true }
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }
tray-icon = "0.21"

[build-dependencies]
winresource = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.23"

[profile.release]
strip = true
