[package]
name = "tokenspeed"
version = "0.5.10"
edition = "2021"
description = "AI coding speed monitor (tokens/s) — ZCode / Codex / OpenCode / Claude Code"
build = "build.rs"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1"
chrono = "0.4"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Console",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_System_Registry",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Controls",
    "Win32_Security",
    "Win32_System_Com",
] }

[build-dependencies]
winresource = "0.1"

[profile.release]
strip = true
